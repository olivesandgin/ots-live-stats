name: Refresh OTS live statistics
on:
  push:
    branches: [main]
    paths: [".github/workflows/refresh.yml", "refresh.mjs", "parse-signal.mjs"]
  schedule:
    - cron: "0 6 * * *"
      timezone: "Europe/Malta"
    - cron: "17 6 * * *"
      timezone: "Europe/Malta"
  workflow_dispatch:

permissions: {}
concurrency:
  group: ots-live-stats
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh if due
        env:
          TZ: Europe/Malta
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] && node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";

          try {
            const { refreshedAt } = JSON.parse(readFileSync("public/live.json", "utf8"));
            const now = new Date();
            const morning = new Date(now);
            morning.setHours(6, 0, 0, 0);
            const lastRefresh = Date.parse(refreshedAt);
            process.exitCode = lastRefresh >= morning.getTime() && lastRefresh <= now.getTime() ? 0 : 1;
          } catch {
            process.exitCode = 1;
          }
          JS
          then
            echo "The feed already refreshed since 06:00 Malta time."
          else
            node refresh.mjs
          fi
      - name: Publish the verified figures and retrieval time
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public MQL5 account statistics"
            git push origin HEAD:main
          fi
